title: 优秀设计与 DRY
status: final
segments:
  - id: s01
    title: 好设计就是容易变更
    scenes:
      - id: s01-c01
        description: 一群上师和大神围着缩略词、列表、模式和图表
        lines:
          - id: s01-l01
            text: 谈到软件设计，到处都有上师和大神，
            cite: ch02-¶010
          - id: s01-l02
            text: 缩略词、列表、模式、图表应有尽有。
            cite: ch02-¶010
          - id: s01-l03
            text: 作者坦言，这本书也未能免俗，
            cite: ch02-¶011
          - id: s01-l04
            text: 先给出一句总体概述。
            cite: ch02-¶011
      - id: s01-c02
        description: 提示14 的标题牌亮起，旁边写着 ETC
        points: [p01]
        lines:
          - id: s01-l05
            text: 好设计比坏设计更容易变更。
            cite: ch02-¶012
          - id: s01-l06
            text: 好的设计能适应使用它的人，
            cite: ch02-¶012
          - id: s01-l07
            text: 落到代码上，就是要能顺应变化。
            cite: ch02-¶012
          - id: s01-l08
            text: 这就是 ETC 原则：更容易变更。
            cite: ch02-¶012
      - id: s01-c03
        description: 解耦、单一职责、命名三个方块依次落下，都指向 ETC
        points: [p02]
        lines:
          - id: s01-l09
            text: 作者认为，无论哪条设计原则，
            cite: ch02-¶013
          - id: s01-l10
            text: 都是 ETC 的一个特例。
            cite: ch02-¶013
          - id: s01-l11
            text: 解耦隔离了关注点，各部分都好改；
            cite: ch02-¶014
          - id: s01-l12
            text: 单一职责让一个需求变化
            cite: ch02-¶015
          - id: s01-l13
            text: 只落在一个模块上；
            cite: ch02-¶015
          - id: s01-l14
            text: 好名字让代码易读，而改代码先要读代码。
            cite: ch02-¶016
          - id: s01-l15
            text: 说到底，都是为了容易变更。
            cite: [ch02-¶014, ch02-¶015, ch02-¶016]
  - id: s02
    title: ETC 是价值观念
    scenes:
      - id: s02-c01
        description: 一个写着 ETC 的向导站在几条路线的分岔口
        points: [p03]
        lines:
          - id: s02-l01
            text: ETC 是一种价值观念。
            cite: ch02-¶017
          - id: s02-l02
            text: 价值观念帮你做决定：
            cite: ch02-¶017
          - id: s02-l03
            text: 该做这个，还是做那个？
            cite: ch02-¶017
          - id: s02-l04
            text: 在软件领域，ETC 就像一个向导，
            cite: ch02-¶017
          - id: s02-l05
            text: 帮你在几条路线中挑出一条。
            cite: ch02-¶017
          - id: s02-l06
            text: 最好让它待在意识之下，
            cite: ch02-¶017
          - id: s02-l07
            text: 悄悄把你推向对的方向。
            cite: ch02-¶017
      - id: s02-c02
        description: 程序员保存文件、写测试、修复 Bug 时，头顶都冒出同一个问题
        points: [p03]
        lines:
          - id: s02-l08
            text: 那要怎么做到呢？
            cite: ch02-¶018
          - id: s02-l09
            text: 作者的经验是，起初要有意识地强化。
            cite: ch02-¶018
          - id: s02-l10
            text: 花一个星期左右，刻意问自己：
            cite: ch02-¶018
          - id: s02-l11
            text: “我刚做的事，让整个系统
            cite: ch02-¶018
          - id: s02-l12
            text: 更容易改，还是更难改？”
            cite: ch02-¶018
          - id: s02-l13
            text: 保存文件时问一次，
            cite: ch02-¶018
          - id: s02-l14
            text: 写测试时问一次，修 Bug 时也问一次。
            cite: ch02-¶018
  - id: s03
    title: 拿不准时怎么办
    scenes:
      - id: s03-c01
        description: 分岔口上，几条路看不出哪条更容易变更
        points: [p04]
        lines:
          - id: s03-l01
            text: ETC 有个隐含的前提：
            cite: ch02-¶019
          - id: s03-l02
            text: 我们能分辨哪条路将来更好改。
            cite: ch02-¶019
          - id: s03-l03
            text: 多数时候，凭常识就能判断。
            cite: ch02-¶019
          - id: s03-l04
            text: 但有时你完全找不到线索。
            cite: ch02-¶020
          - id: s03-l05
            text: 作者说这不要紧，可以做两件事。
            cite: ch02-¶020
      - id: s03-c02
        description: 一块代码被整块拿出，换上另一块，路上没有路障
        points: [p04]
        lines:
          - id: s03-l06
            text: 第一件：让你写的东西可以替换。
            cite: ch02-¶021
          - id: s03-l07
            text: 不管将来怎么变，
            cite: ch02-¶021
          - id: s03-l08
            text: 这段代码都不会挡路。
            cite: ch02-¶021
          - id: s03-l09
            text: 听着有点极端，其实一直都该这样做。
            cite: ch02-¶021
          - id: s03-l10
            text: 只要始终保持代码解耦、内聚就行。
            cite: ch02-¶021
      - id: s03-c03
        description: 一本工程日志翻开，记着几个选择和猜测，源码里插着一个标签
        points: [p04]
        lines:
          - id: s03-l11
            text: 第二件：把它当成培养直觉的机会。
            cite: ch02-¶022
          - id: s03-l12
            text: 在工程日志里记下当时的处境：
            cite: ch02-¶022
          - id: s03-l13
            text: 有哪些选择，对变化有什么猜测。
            cite: ch02-¶022
          - id: s03-l14
            text: 再在源码里留个标签，
            cite: ch02-¶022
          - id: s03-l15
            text: 以后要改这里时，回头看看当初的记录。
            cite: ch02-¶022
          - id: s03-l16
            text: 下次碰到类似的分岔口，就有帮助了。
            cite: ch02-¶022
  - id: s04
    title: 程序员一直在维护
    scenes:
      - id: s04-c01
        description: 柯克船长对着电脑说出两条自相矛盾的知识，电脑崩溃
        lines:
          - id: s04-l01
            text: 柯克船长对付人工智能时，
            cite: ch02-¶034
          - id: s04-l02
            text: 最爱给电脑两条互相矛盾的知识。
            cite: ch02-¶034
          - id: s04-l03
            text: 可惜，这招拿来搞垮你的代码也一样灵。
            cite: ch02-¶034
      - id: s04-c02
        description: 程序员把知识装进文档、规范、代码和测试
        lines:
          - id: s04-l04
            text: 程序员的工作，就是收集、组织、
            cite: ch02-¶035
          - id: s04-l05
            text: 维护和治理知识。
            cite: ch02-¶035
          - id: s04-l06
            text: 知识写进文档和规范，在代码里运行，
            cite: ch02-¶035
          - id: s04-l07
            text: 也在测试里决定要检查什么。
            cite: ch02-¶035
      - id: s04-c03
        description: 一块知识不停改变：客户开会、政府改规定、算法行不通
        points: [p05]
        lines:
          - id: s04-l08
            text: 可是知识并不稳定，还常常在变。
            cite: ch02-¶036
          - id: s04-l09
            text: 跟客户开次会，对需求的看法就变了；
            cite: ch02-¶036
          - id: s04-l10
            text: 政府改条规定，业务逻辑就过时了；
            cite: ch02-¶036
          - id: s04-l11
            text: 测试也可能发现原来的算法行不通。
            cite: ch02-¶036
      - id: s04-c04
        description: 一条开发过程的时间线，维护从起点一直延续，不是从发布才开始
        points: [p05]
        lines:
          - id: s04-l12
            text: 很多人以为，维护从程序发布才开始，
            cite: ch02-¶037
          - id: s04-l13
            text: 作者认为他们错了。
            cite: ch02-¶037
          - id: s04-l14
            text: 程序员一直处在维护状态，从没停过。
            cite: ch02-¶037
          - id: s04-l15
            text: 我们的理解每天都在变，
            cite: ch02-¶037
          - id: s04-l16
            text: 新需求不断出现，旧需求也在发展。
            cite: ch02-¶037
          - id: s04-l17
            text: 维护不是一个单独的活动，
            cite: ch02-¶037
          - id: s04-l18
            text: 而是贯穿整个开发过程的常态。
            cite: ch02-¶037
  - id: s05
    title: DRY 管的是知识
    scenes:
      - id: s05-c01
        description: 同一个知识胶囊被复制进规范、流程和程序三处
        points: [p06]
        lines:
          - id: s05-l01
            text: 维护时，得找到并修改知识的表达。
            cite: ch02-¶038
          - id: s05-l02
            text: 可在规范、流程和程序里复制知识太容易，
            cite: ch02-¶038
          - id: s05-l03
            text: 一旦复制，维护就成了噩梦，
            cite: ch02-¶038
          - id: s05-l04
            text: 而且发布之前噩梦就开始了。
            cite: ch02-¶038
      - id: s05-c02
        description: 提示15 的标题牌亮起：DRY
        points: [p07]
        lines:
          - id: s05-l05
            text: 想让软件好开发、好维护，
            cite: ch02-¶039
          - id: s05-l06
            text: 唯一办法是遵循 DRY 原则：
            cite: ch02-¶039
          - id: s05-l07
            text: 系统里的每一处知识，
            cite: ch02-¶040
          - id: s05-l08
            text: 都要有单一、明确、权威的表达。
            cite: ch02-¶040
          - id: s05-l09
            text: DRY，就是不要重复自己。
            cite: ch02-¶041
      - id: s05-c03
        description: 两处表达相同的知识，只改了一处，电脑因为矛盾崩溃
        points: [p06]
        lines:
          - id: s05-l10
            text: 反过来，把同一件事写在两个以上地方，
            cite: ch02-¶042
          - id: s05-l11
            text: 改了一处，就得记着改其他各处。
            cite: ch02-¶042
          - id: s05-l12
            text: 不然程序会像那台外星电脑一样，
            cite: ch02-¶042
          - id: s05-l13
            text: 因为一处矛盾而崩溃。
            cite: ch02-¶042
          - id: s05-l14
            text: 问题不在记不记得住，而在何时会忘。
            cite: ch02-¶042
      - id: s05-c04
        description: “复制粘贴源码”只占一个大方块的一小角，大方块写着知识和意图
        points: [p08]
        lines:
          - id: s05-l15
            text: 很多人以为 DRY 只是别复制粘贴代码。
            cite: ch02-¶045
          - id: s05-l16
            text: 作者说，这只是很小的一部分。
            cite: ch02-¶046
          - id: s05-l17
            text: DRY 针对的是知识和意图的重复：
            cite: ch02-¶047
          - id: s05-l18
            text: 两处说的是同一件事，哪怕写法完全不同。
            cite: ch02-¶047
      - id: s05-c05
        description: 改一处时，代码、文档、数据库 Schema 要一起改
        points: [p08]
        lines:
          - id: s05-l19
            text: 可以这样检验：
            cite: ch02-¶048
          - id: s05-l20
            text: 代码的某一方面要改时，
            cite: ch02-¶048
          - id: s05-l21
            text: 你是不是得在好几处、用好几种格式改？
            cite: ch02-¶048
          - id: s05-l22
            text: 比如同时改代码和文档。
            cite: ch02-¶048
          - id: s05-l23
            text: 如果是，你的代码就不满足 DRY。
            cite: ch02-¶048
