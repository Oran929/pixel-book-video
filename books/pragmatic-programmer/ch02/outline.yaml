chapter: 2
episodes:
  - id: ep01
    topic: 优秀设计与 DRY
    units:
      - 8
      - unit: 9
        from: ch02-¶034
        to: ch02-¶049
    segments:
      - title: 好设计就是容易变更
        minutes: 1.0
      - title: ETC 是价值观念
        minutes: 1.0
      - title: 拿不准时怎么办
        minutes: 1.0
      - title: 程序员一直在维护
        minutes: 1.0
      - title: DRY 管的是知识
        minutes: 1.0
    points:
      - id: p01
        text: 能适应使用者的设计才是好设计，落到代码上就是要容易变更，这就是 ETC 原则
        cite: ch02-¶012
      - id: p02
        text: 各种设计原则都可以看成 ETC 的特例，比如解耦、单一职责和好的命名，最终都是为了让代码好改
        cite: [ch02-¶013, ch02-¶014, ch02-¶015, ch02-¶016]
      - id: p03
        text: ETC 不是硬性规则，而是帮你在几条路线之间做选择的价值观念；起初要有意识地问自己，刚才的改动让系统更好改还是更难改
        cite: [ch02-¶017, ch02-¶018]
      - id: p04
        text: 看不出哪条路更容易变更时，就让写的代码可以被替换，并在工程日志里记下当时的选择和猜测，用来培养直觉
        cite: [ch02-¶019, ch02-¶020, ch02-¶021, ch02-¶022]
      - id: p05
        text: 知识总在变化，所以维护不是发布之后才开始的事，程序员在整个开发过程中都处在维护状态
        cite: [ch02-¶035, ch02-¶036, ch02-¶037]
      - id: p06
        text: 同一份知识写在好几个地方，改了一处就得记着改其他各处，迟早会忘，维护就成了噩梦
        cite: [ch02-¶038, ch02-¶042]
      - id: p07
        text: DRY 原则要求系统里的每一处知识都只有单一、明确、权威的表达
        cite: [ch02-¶039, ch02-¶040]
      - id: p08
        text: DRY 说的不只是别复制粘贴代码，而是别重复知识和意图；如果改一个地方要在多处、以多种格式同时改，就违背了 DRY
        cite: [ch02-¶045, ch02-¶046, ch02-¶047, ch02-¶048]

  - id: ep02
    topic: 形形色色的重复
    units:
      - unit: 9
        from: ch02-¶050
        to: ch02-¶099
    segments:
      - title: 代码里的重复
        minutes: 1.0
      - title: 相同不一定是重复
        minutes: 0.75
      - title: 注释和数据里的重复
        minutes: 1.25
      - title: 和外部打交道
        minutes: 1.0
      - title: 开发人员之间的重复
        minutes: 1.0
    points:
      - id: p09
        text: 一段打印报表的代码里藏着好几处重复，把负数处理和格式化各自收进一个函数后，改格式只需要改一个地方
        cite: [ch02-¶052, ch02-¶054, ch02-¶056, ch02-¶058, ch02-¶060]
      - id: p10
        text: 代码一模一样不等于知识重复：校验年龄和校验数量碰巧用了同一条规则，这是巧合而不是重复
        cite: [ch02-¶062, ch02-¶064, ch02-¶065]
      - id: p11
        text: 注释把代码已经表达的意图又写一遍，也是重复，迟早会和代码对不上；用准确的命名代替这种注释
        cite: [ch02-¶068, ch02-¶069, ch02-¶071]
      - id: p12
        text: 数据结构也会重复知识，比如线段的长度由两个端点决定，应当算出来而不是另存一份；为了性能缓存时，把这种违背限制在类的内部
        cite: [ch02-¶072, ch02-¶074, ch02-¶076]
      - id: p13
        text: 模块直接暴露数据结构会让使用者和实现耦合，尽量通过访问器函数来读写属性
        cite: [ch02-¶078, ch02-¶079, ch02-¶080]
      - id: p14
        text: 代码和外部的 API、数据打交道时，两边都得懂接口，这种重复躲不开，但能减轻：用中立格式描述内部 API，采用公开 API 的正式规范，从数据源的 schema 生成代码
        cite: [ch02-¶081, ch02-¶082, ch02-¶083, ch02-¶084, ch02-¶085]
      - id: p15
        text: 最难发现的是不同开发人员之间的重复，最好的办法是鼓励大家经常交流，比如晨会、讨论频道和专人管理项目知识
        cite: [ch02-¶088, ch02-¶091, ch02-¶092, ch02-¶093]
      - id: p16
        text: 要营造一个容易找到、容易复用已有东西的环境；复用不方便，人们就会自己再写一遍，知识也就重复了
        cite: ch02-¶094

  - id: ep03
    topic: 正交性的好处
    units:
      - unit: 10
        from: ch02-¶100
        to: ch02-¶119
    segments:
      - title: 什么是正交性
        minutes: 1.0
      - title: 直升机噩梦
        minutes: 1.25
      - title: 消除无关的影响
        minutes: 0.75
      - title: 提高生产力
        minutes: 1.0
      - title: 降低风险
        minutes: 1.0
    points:
      - id: p17
        text: 正交原本指两条直线成直角，在计算科学里指独立或解耦：一个东西变了，不影响其他东西，比如改界面不必动数据库
        cite: [ch02-¶101, ch02-¶103]
      - id: p18
        text: 直升机的每个操控都会牵动其他操控，这样的非正交系统天生复杂，难以变更和控制，也没法只修一处
        cite: [ch02-¶107, ch02-¶108, ch02-¶109]
      - id: p19
        text: 消除不相关事物之间的影响：让组件自成一体、职责单一，只要不改对外接口，改动就不会波及整个系统
        cite: ch02-¶110
      - id: p20
        text: 正交的系统带来两大收益：提高生产力，降低风险
        cite: ch02-¶111
      - id: p21
        text: 生产力来自三点：变更限制在局部，组件更容易被重用，两个正交组件组合起来能做 M×N 件事
        cite: [ch02-¶112, ch02-¶113, ch02-¶114]
      - id: p22
        text: 风险的降低体现在：出问题的部分被隔离，系统不那么脆弱，更容易测试，也不会被某个供应商或平台绑死
        cite: [ch02-¶115, ch02-¶116, ch02-¶117, ch02-¶118, ch02-¶119]

  - id: ep04
    topic: 把正交性用起来
    units:
      - unit: 10
        from: ch02-¶120
        to: ch02-¶163
    segments:
      - title: 设计时
        minutes: 1.0
      - title: 选工具包和库时
        minutes: 0.75
      - title: 写代码时
        minutes: 1.25
      - title: 测试和文档
        minutes: 1.0
      - title: 正交与 DRY
        minutes: 0.75
    points:
      - id: p23
        text: 分层是设计正交系统的有力办法；检验设计时问一句，某个功能的需求大改时会影响几个模块，正交的系统答案应该是一个
        cite: [ch02-¶121, ch02-¶123]
      - id: p24
        text: 设计还要和现实世界的变化解耦，别拿电话号码这类你控制不了的外部标识做客户标识
        cite: ch02-¶125
      - id: p25
        text: 引入工具包或库时，想想它会不会逼你的代码做本不需要的改动；EJB 把事务声明放在业务方法之外，就是正交的例子
        cite: [ch02-¶126, ch02-¶127, ch02-¶128, ch02-¶129]
      - id: p26
        text: 写代码时保持正交：写害羞的代码，避免全局数据和滥用单例，避免一组只有中间算法不同的相似函数
        cite: [ch02-¶131, ch02-¶132, ch02-¶133, ch02-¶134, ch02-¶135, ch02-¶136, ch02-¶137, ch02-¶138]
      - id: p27
        text: 要养成不断质疑代码的习惯，一有机会就重构，改善结构和正交性
        cite: ch02-¶139
      - id: p28
        text: 正交的系统更好测试；写单元测试要牵进大半个系统，或修一个 Bug 要改很多处，都说明模块没解耦好
        cite: [ch02-¶140, ch02-¶141, ch02-¶142]
      - id: p29
        text: 文档也可以正交：内容和呈现分开，换外观不用改内容
        cite: ch02-¶143
      - id: p30
        text: DRY 减少重复，正交减少组件之间的依赖，两者结合让系统更灵活、更好维护；如果改一处总会弄坏别处，就该重构了
        cite: [ch02-¶144, ch02-¶145]

  - id: ep05
    topic: 可逆性：不设最终决定
    units:
      - 11
    segments:
      - title: 没有永恒的事实
        minutes: 1.0
      - title: 关键决定难回头
        minutes: 1.0
      - title: 不设最终决定
        minutes: 1.25
      - title: 灵活的架构
        minutes: 1.0
      - title: 装着猫的盒子
        minutes: 0.75
    points:
      - id: p31
        text: 工程师和管理层都喜欢简单唯一的答案，可现实没有永远不变的事实，你越依赖某个事实，它越可能变
        cite: [ch02-¶166, ch02-¶167]
      - id: p32
        text: 每做一个关键决定，可选的路就少一些；选定数据库、架构模式或部署模型后，再想回头代价巨大
        cite: [ch02-¶170, ch02-¶172, ch02-¶173]
      - id: p33
        text: 坚持解耦和外部配置，就不必做太多不可逆的决定；比如把数据库抽象成只提供持久化的服务，中途就能换成另一家的数据库
        cite: [ch02-¶174, ch02-¶175]
      - id: p34
        text: 不设最终决定：别把决定当成刻在石头上，而要当成写在沙滩上，随时可能被浪冲掉
        cite: ch02-¶177
      - id: p35
        text: 服务端架构的流行做法一换再换，没法提前准备，但可以让修改容易一点：把第三方 API 藏在自己的抽象层后面，把代码拆成组件
        cite: [ch02-¶178, ch02-¶179, ch02-¶189, ch02-¶190]
      - id: p36
        text: 放弃追逐时尚：没人知道未来，要让代码在顺境和逆境里都站得住
        cite: [ch02-¶191, ch02-¶192]
      - id: p37
        text: 代码的演化就像装满薛定谔之猫的盒子，每个决定都通向不同的未来，值得想想你的代码能支持多少种未来
        cite: [ch02-¶201, ch02-¶202]

  - id: ep06
    topic: 曳光弹
    units:
      - 12
    segments:
      - title: 曳光弹的比喻
        minutes: 1.0
      - title: 先打通一条路
        minutes: 1.0
      - title: 不是一次性代码
        minutes: 0.75
      - title: 曳光代码的好处
        minutes: 1.0
      - title: 没打中就调整
        minutes: 0.5
      - title: 曳光代码与原型
        minutes: 1.0
    points:
      - id: p38
        text: 曳光弹和普通子弹在同样条件下飞行，枪手看着轨迹就能实时修正瞄准；做从未做过的项目时，也需要这种在真实条件下的即时反馈
        cite: [ch02-¶209, ch02-¶210, ch02-¶214]
      - id: p39
        text: 需求模糊、技术陌生、环境还会变，常见反应是先把一切规定死再开火，务实的程序员则选择曳光弹式的做法
        cite: [ch02-¶211, ch02-¶212, ch02-¶213]
      - id: p40
        text: 使用曳光弹找到目标：先挑定义系统的关键需求和风险最大的地方，搭一个最简单的特性，把所有层从头到尾打通
        cite: [ch02-¶215, ch02-¶216, ch02-¶217, ch02-¶218]
      - id: p41
        text: 曳光代码不是写完就扔的，它要有生产代码该有的错误检查、结构和文档，只是功能还不全，之后在这个框架上逐步加功能
        cite: [ch02-¶222, ch02-¶223]
      - id: p42
        text: 曳光代码的好处：用户更早用上能工作的东西，开发者有了可以往里填代码的框架，有了集成平台，随时有东西演示，对进度也更有数
        cite: [ch02-¶225, ch02-¶226, ch02-¶228, ch02-¶230, ch02-¶232, ch02-¶234]
      - id: p43
        text: 曳光弹不一定每次都命中，没打中就调整瞄准；小块代码惯性小，改起来快，反馈也便宜
        cite: [ch02-¶236, ch02-¶237]
      - id: p44
        text: 曳光代码和原型不同：原型探索某个方面，用完就扔；曳光代码虽简单但完整，是最终系统框架的一部分，原型更像发射曳光弹之前的侦察
        cite: [ch02-¶238, ch02-¶241, ch02-¶242]

  - id: ep07
    topic: 原型与便签
    units:
      - 13
    segments:
      - title: 原型便宜在哪
        minutes: 1.0
      - title: 给什么做原型
        minutes: 0.75
      - title: 原型可以不管什么
        minutes: 1.0
      - title: 架构原型
        minutes: 1.0
      - title: 原型不能上线
        minutes: 1.0
    points:
      - id: p45
        text: 原型用很低的成本暴露风险和不确定的地方；它不一定是代码，便签、白板上的草图都可以
        cite: [ch02-¶250, ch02-¶251, ch02-¶252]
      - id: p46
        text: 原型只为回答几个问题，所以能忽略眼下不重要的细节；如果细节怎么都放不下，也许该用曳光弹
        cite: [ch02-¶253, ch02-¶254]
      - id: p47
        text: 值得做原型的是有风险、没试过、对系统很关键、未经证实或让你不踏实的东西，比如架构、性能问题、界面设计
        cite: [ch02-¶255, ch02-¶256, ch02-¶260, ch02-¶261]
      - id: p48
        text: 用原型学习：原型的价值不在写出的代码，而在得到的教训
        cite: ch02-¶262
      - id: p49
        text: 做原型时可以不管正确性、完整性、健壮性和格式，也可以换用更高阶的脚本语言，反正原型最后要扔掉
        cite: [ch02-¶263, ch02-¶264, ch02-¶266, ch02-¶268, ch02-¶270, ch02-¶272]
      - id: p50
        text: 架构原型可以只用便签和索引卡，用来检查主要组件的职责和协作是否清楚、耦合是否最小、每个模块能不能拿到需要的数据
        cite: [ch02-¶275, ch02-¶276, ch02-¶277, ch02-¶278, ch02-¶281, ch02-¶282]
      - id: p51
        text: 要让所有人明白原型是一次性代码，别被拿去部署；如果原型的用途很可能被误解，干脆改用曳光弹
        cite: [ch02-¶283, ch02-¶284, ch02-¶285]

  - id: ep08
    topic: 领域语言
    units:
      - 14
    segments:
      - title: 语言影响思考
        minutes: 1.0
      - title: 真实的领域语言
        minutes: 1.25
      - title: 内部语言和外部语言
        minutes: 1.0
      - title: 怎么取舍
        minutes: 1.0
      - title: 廉价的内部语言
        minutes: 0.75
    points:
      - id: p52
        text: 编程语言会影响你思考问题的方式，而问题域本身的语言更能启发解决方案
        cite: ch02-¶298
      - id: p53
        text: 靠近问题域编程：用应用领域的词汇写代码，更进一步就直接用领域的词汇、语法和语义来编程
        cite: ch02-¶299
      - id: p54
        text: 真实的领域语言有 RSpec 测试、Cucumber 测试、Phoenix 路由和 Ansible 配置
        cite: [ch02-¶301, ch02-¶303, ch02-¶309, ch02-¶312]
      - id: p55
        text: Cucumber 本想让客户读懂测试，但商务人士很少真去读，与其让他们签需求文档，不如直接交付能运行的代码
        cite: [ch02-¶305, ch02-¶306, ch02-¶307, ch02-¶308]
      - id: p56
        text: RSpec 和 Phoenix 路由是内部领域语言，写在宿主语言里，扩展了编码词汇；Cucumber 和 Ansible 是外部语言，由程序读入再转换
        cite: [ch02-¶316, ch02-¶317, ch02-¶318, ch02-¶319]
      - id: p57
        text: 内部语言能白用宿主语言的能力，却受它的语法限制；外部语言没有这个限制，但得写解析器，这并不简单
        cite: [ch02-¶320, ch02-¶323, ch02-¶325, ch02-¶326]
      - id: p58
        text: 做领域语言花的力气不能比省下的多；能用 YAML、JSON、CSV 这类现成格式就用，否则用内部语言，只有让用户来写时才考虑外部语言
        cite: [ch02-¶327, ch02-¶328]
      - id: p59
        text: 最便宜的内部语言是直接写一组函数，RSpec 里的 describe、it、expect 其实都只是 Ruby 方法
        cite: [ch02-¶329, ch02-¶331]

  - id: ep09
    topic: 估算
    units:
      - 15
    segments:
      - title: 估算有什么用
        minutes: 0.75
      - title: 多精确才够
        minutes: 1.0
      - title: 估算从何而来
        minutes: 1.25
      - title: 记录你的估算
        minutes: 0.5
      - title: 估算项目进度
        minutes: 1.25
      - title: 被问时怎么答
        minutes: 0.5
    points:
      - id: p60
        text: 通过估算来避免意外：缺信息的问题也能估，练出对数量级的直觉后，一听就能判断事情是否可行
        cite: [ch02-¶351, ch02-¶352]
      - id: p61
        text: 先问答案用在什么场合、要多精确；单位也传达精度，说 130 个工作日比说大约 6 个月听起来更精确
        cite: [ch02-¶354, ch02-¶355, ch02-¶357, ch02-¶358]
      - id: p62
        text: 最简单的办法是问问做过类似事情的人；正式估算前先弄清问的是什么、范围多大
        cite: [ch02-¶359, ch02-¶360]
      - id: p63
        text: 估算靠建模：搭一个粗略模型，拆成组件，找出影响最大的参数并尽量估准，再变换关键参数多算几组，围绕这些参数给出答案
        cite: [ch02-¶361, ch02-¶363, ch02-¶364, ch02-¶365, ch02-¶366, ch02-¶368]
      - id: p64
        text: 把做过的估算记下来，估错了就去查原因，下一次会估得更好
        cite: [ch02-¶370, ch02-¶371]
      - id: p65
        text: PERT 给每个任务乐观、最可能和悲观三个估计，用范围代替拍脑袋的单一数字；但作者不看好画满一面墙的图表就能估准
        cite: [ch02-¶375, ch02-¶376, ch02-¶377, ch02-¶378, ch02-¶379]
      - id: p66
        text: 项目进度只能从做这个项目的经验里得来：一轮轮迭代，每轮结束时修正对迭代次数和内容的猜测，就像一口一口吃掉大象
        cite: [ch02-¶380, ch02-¶385, ch02-¶386, ch02-¶387]
      - id: p67
        text: 根据代码不断迭代进度表：进度由团队、生产力和环境共同决定，要在每次迭代中修正
        cite: [ch02-¶388, ch02-¶415]
      - id: p68
        text: 被要求估算时，万能的回答是「我等一下答复你」，花时间按步骤做，结果总会更好
        cite: [ch02-¶353, ch02-¶389, ch02-¶390]
