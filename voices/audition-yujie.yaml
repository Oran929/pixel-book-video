# 御姐音色试听方案（只含新候选，不重跑 audition.yaml 里的五个）
# 运行：cd tools && uv run pixelbook audition --plan ../voices/audition-yujie.yaml --out ../voices/audition/yujie
# 选定：cd tools && uv run pixelbook choose-voice <名字> --from ../voices/audition/yujie
# 测试旁白和参考句与 audition.yaml 相同，方便横向对比。
lines:
  - 这条原则叫 DRY，意思是不要重复你自己。
  - 正交性说的是，改动一个模块，不应该影响到另一个模块。
  - 大模型推理时，KV Cache 会占掉大量显存。
reference_text: 今天我们一起读一本书，看看作者是怎样一步一步，把一个复杂的问题讲清楚的。
params:
  language: chinese
candidates:
  # 强度 1：甜妹，最适合长时间讲解
  - name: tianmei
    model: mlx-community/Qwen3-TTS-12Hz-1.7B-VoiceDesign-bf16
    instruct: 甜美少女的台湾腔声音，声音颗粒感较为细腻柔和，语速中等，适合长时间讲解，偏活泼
  # 强度 2：慵懒魅惑，最"撩"
  - name: yujie
    model: mlx-community/Qwen3-TTS-12Hz-1.7B-VoiceDesign-bf16
    instruct: 成熟温柔的御姐声，音色颗粒感细腻温润，像说故事一样，适合长时间讲解，娓娓道来
