# 语音识别复核（票 07）：每句配音转回文字，规范化后和朗读文本对比。
# 改这里不影响声音：不触发音色锁定守卫，已缓存的句子也不会重新生成或重新复核
# （要重新复核某句，删掉它在 books/<书>/cache/tts/ 里的缓存）。
#
# asr：识别模型，whisper 或 qwen3-asr
# max_diff_rate：差异率阈值，复核分两步共用它（2026-10-28 用户决定）：
#   1. 字符差异率（规范化后的编辑距离 ÷ 朗读文本字数）不超过它，就通过；
#   2. 否则把两边转成不带声调的拼音再比，拼音差异率不超过它，也算通过（同音字）；
#   两步都不通过才算不通过。取 0：字或拼音必须一个不差（单字读错的差异率约 0.1）
# max_retries：不通过时最多重新生成几次；仍不通过就用差异率最低的一版，列进检查报告
asr: qwen3-asr
max_diff_rate: 0
max_retries: 2
