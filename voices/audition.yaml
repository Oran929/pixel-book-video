# 音色试听方案：`uv run pixelbook audition` 用每个候选音色读同一段测试旁白。
# 测试旁白故意保留原样的术语（不套读音表），用来发现读错的术语。
lines:
  - 这条原则叫 DRY，意思是不要重复你自己。
  - 正交性说的是，改动一个模块，不应该影响到另一个模块。
  - 大模型推理时，KV Cache 会占掉大量显存。
# 设计音色另读这一句，选中后存成参考音频，供 Base 模型克隆；不要放术语
reference_text: 今天我们一起读一本书，看看作者是怎样一步一步，把一个复杂的问题讲清楚的。
params:
  language: chinese
candidates:
  # 甜妹，最适合长时间讲解（当前默认音色）
  - name: tianmei
    model: mlx-community/Qwen3-TTS-12Hz-1.7B-VoiceDesign-bf16
    instruct: 甜美少女的台湾腔声音，声音颗粒感较为细腻柔和，语速中等，适合长时间讲解，偏活泼
  # 御姐，娓娓道来
  - name: yujie
    model: mlx-community/Qwen3-TTS-12Hz-1.7B-VoiceDesign-bf16
    instruct: 成熟温柔的御姐声，音色颗粒感细腻温润，像说故事一样，适合长时间讲解，娓娓道来
