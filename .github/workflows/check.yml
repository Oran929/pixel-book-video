# 在 PR 和 main 上跑 make check。私有仓库设不了「合并前必须通过」，合并前自己看 Checks。
# Linux 上不装 mlx-audio（pyproject 里限定 darwin），所以 check 若意外依赖 MLX 会直接失败。
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: video/package-lock.json

      # Python 版本由 uv 按 tools/pyproject.toml 的 requires-python 安装
      - uses: astral-sh/setup-uv@v10.3.2

      # test_render.py 里有两个测试在没有 ffmpeg 时会跳过
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: make install
      - run: make check
