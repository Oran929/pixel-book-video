# 音色试听方案：`uv run pixelbook audition` 用每个候选音色读同一段测试旁白。
# 测试旁白故意保留原样的术语（不套读音表），用来发现读错的术语。
lines:
  - 这条原则叫 DRY，意思是不要重复你自己。
  - 正交性说的是，改动一个模块，不应该影响到另一个模块。
  - 大模型推理时，KV Cache 会占掉大量显存。
# 设计音色另读这一句，选中后存成参考音频，供 Base 模型克隆；不要放术语
