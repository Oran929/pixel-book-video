# 读音表：全频道共用的"术语 → 朗读写法"对照表。
# 生成朗读文本时机械替换（最长的术语优先，区分大小写）；旁白句手写了 speech 时不套用。
# 读法不变的术语也要登记成原样不变的条目（如 `DRY: DRY`），表示"已确认"，否则会被当成新术语。
# yes、no、on、off、纯数字这类术语要加引号，否则 YAML 会把它读成别的类型。
DRY: DRY
KV Cache: KV Cache
ETC: E T C
Bug: Bug
printf: print f
format_amount: format amount
report_line: report line
Meyer: 迈耶
API: A P I
schema: schema
OpenAPI: Open A P I
Scrum: Scrum
Slack: Slack
M: M
N: N
